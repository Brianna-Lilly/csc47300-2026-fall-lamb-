<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer> </script>
</head>
<body>

    <div class="container">

        <div class="side">
            
            <div class="map-container"> 
                <!-- Map background image -->
                <img src="images/CCNYMap.png" alt ="CCNY Map">
            
                <!-- feature is capacity tracker, change name later-->
                <!--perhaps replace onclick when adding more buildings...-->
                <div class="building building-s" onclick="showFeature('Shepard')">
                    <!-- Shepard-->
                    <img src="images/barn3.png">
                </div>

                <div class="building building-m" onclick="showFeature('Marshak')">
                    <!-- Marshak -->
                    <img src="images/barn2.png">
                </div>

                <div class="building building-n" onclick="showFeature('NAC')">
                    <!-- NAC-->
                    <img src="images/barn1.png">
                </div>

            </div> <!---map-container-->

        </div> <!---side (left- map)-->

        <div class="side">

            <div class="title title-s" onclick="showFeature('Shepard')"> 
                Shepard Hall
            </div>

            <div class="title title-m" onclick="showFeature('Marshak')"> 
                Marshak Science Building
            </div>

            <div class="title title-n" onclick="showFeature('NAC')"> 
                North Academic Center
            </div>
            
        </div> <!---side (right - titles)-->

        <!-- building information overlay test -->
        <div id="feature-view" class="feature-view">
            <div class="feature-content">
                <button class="close-button" onclick="closeFeature()"></button>
                <!--placeholder info?-->
                <h2 id="feature-title">building name here</h2>
                <p id="feature-description"> description here</p>
            </div>
        </div>

    </div> <!--container-->

<!-- Report Status popup -->
<div id="report-modal" class="report-modal" style="display: none;">
    <div class="report-modal-content">
        <button type="button" class="close-button"
                onclick="closeReportForm()"></button>

        <h2>Report Status</h2>

        <form id="report-form">
            <label for="report-building">Building Name</label>
            <input id="report-building" type="text" readonly>

            <label for="report-equipment">Elevator / Escalator</label>
            <select id="report-equipment" required></select>

            <label for="report-email">Your Email</label>
            <input id="report-email" type="email"
                   placeholder="Enter your email" required>

            <label for="report-crowding">Crowding Level</label>
            <select id="report-crowding" required>
                <option value="unknown">Not sure</option>
                <option value="low">🐑 Low Traffic</option>
                <option value="moderate">🐑🐑🐑 Moderate Traffic</option>
                <option value="heavy">🐑🐑🐑🐑🐑 Heavy Traffic</option>
            </select>

            <label for="report-working">Is it working?</label>
            <select id="report-working" required>
                <option value="yes">Yes — Working</option>
                <option value="no">No — Not Working</option>
            </select>

            <label for="report-details">Additional Details (optional)</label>
            <textarea id="report-details"
                      rows="3"
                      placeholder="Describe the issue..."></textarea>

            <button type="submit" class="report-submit">
                Submit Report
            </button>

            <p id="report-message" role="status"></p>
        </form>
    </div>
</div>

</div> 

    <!-- Directory Button -->
    <button>
    <img src="images/directory button.webp" alt="Directory" class="floating-directory-btn" onClick="openDirectoryModal()">
    </button>

    <div id="directory-modal" class="report-modal" style="display: none;">
        <div class="report-modal-content directory-content-box">
            <button type="button" class="close-button" onclick="closeDirectoryModal()"></button>
            <h2>Campus Equipment Directory</h2>
            <p style="font-size: 0.9rem; color: #555;">Live status and crowding for all elevators and escalators on campus.</p>
            <div id="directory-list-container" style="margin-top: 15px;">
            </div>
        </div>
    </div>
</body>
</html>
